# Simulation parameters
dt: 0.008 # Time sampling for dynamic simulation
simulation_time: 100 # seconds
frame_skip: 1 # Number of frames to skip for smoother animation
threshold: 2.0  # Stop simulation threshold
target_shift_threshold_distance: 5 # Shift to next segment threshold 
noise_annoyance_radius: 15 # Radius for noise annoyance calculation in meters

max_rpm: 3000 # Maximum RPM for the motors
n_rotors: 4 # Number of rotors
max_roll_angle: 30
max_pitch_angle: 30
max_yaw_angle: 30 # Maximum yaw angle in degrees

max_h_speed_limit_kmh: 50.0
max_v_speed_limit_kmh: 20.0
max_angle_limit_deg: 30.0
anti_windup_contrib: 0.4

# Trajectory parameters and World settings
world_data_path: "Worlds/training_world.pkl"
start_point: [5.0, 50.0, 1.0]
end_point: [95.0, 50.0, 1.0]
n_intermediate_waypoints: 5
waypoint_perturbation_range: 50.0

# Rotor model parameters
norm_params_path: "Rotor/normalization_params.pth"
rotor_model_path: "Rotor/rotor_model.pth"

